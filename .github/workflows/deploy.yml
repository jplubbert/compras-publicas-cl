# Deploy on merge to main (REQ-002): the same local checks as ci.yml, then terraform apply of infra/main in the
# protected environment production, authenticated with WIF (DEC-004, no service account keys).
# After a successful apply the state is backed up to a bucket in a separate project (REQ-016); the upload uses the
# Cloud Storage JSON API because the CI service account only holds roles/storage.objectCreator on that bucket.
# The first apply that creates the ingest Cloud Run Jobs may wait for the CI actAs grant on compras-ingest to
# propagate: scripts/it/tf-apply.sh retries only that error (REQ-006).
# Then the release job (REQ-006 E5) publishes the ingest image tagged with the commit, points the two Cloud Run Jobs at
# it and runs Dataform in the isolated CI run (schemaSuffix "ci", raw_dataset=raw_ci) with its assertions.
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up tools
        run: scripts/setup.sh
      - name: Lint
        run: scripts/env.sh npm run lint
      - name: Test
        run: scripts/env.sh npm test
      - name: Check repo
        run: scripts/env.sh npm run check:repo
      - name: Check spec
        run: scripts/env.sh npm run check:spec
      - name: Dataform compile
        run: scripts/env.sh bash -c 'cd dataform && node_modules/.bin/dataform compile'

  apply:
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_github_repository: ${{ github.repository }}
      # REQ-014: HCL lists such as ["group:analistas@example.com"]; empty when the variable is not set.
      TF_VAR_pii_readers: ${{ vars.PII_READERS || '[]' }}
      TF_VAR_lector_impersonators: ${{ vars.LECTOR_IMPERSONATORS || '[]' }}
      STATE_BACKUP_BUCKET: ${{ vars.STATE_BACKUP_BUCKET }}
    outputs:
      policy_tag_rut: ${{ steps.governance.outputs.policy_tag_rut }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up tools
        run: scripts/setup.sh
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}
      # Only to mint an access token from the WIF credentials; gcloud storage would also need get/list.
      - uses: google-github-actions/setup-gcloud@v2
      - name: Terraform apply
        run: scripts/it/tf-apply.sh
      # The full name of the rut policy tag, a compilation variable of the Dataform run in ci (REQ-014).
      - name: Export policy_tag_rut
        id: governance
        run: |
          tag=$(scripts/env.sh terraform -chdir=infra/main output -raw policy_tag_rut)
          test -n "$tag"
          echo "policy_tag_rut=$tag" >> "$GITHUB_OUTPUT"
      - name: Back up Terraform state
        run: |
          : "${STATE_BACKUP_BUCKET:?STATE_BACKUP_BUCKET is required}"
          state="$RUNNER_TEMP/infra-main.tfstate"
          scripts/env.sh terraform -chdir=infra/main state pull > "$state"
          test -s "$state"
          token=$(gcloud auth print-access-token)
          echo "::add-mask::$token"
          name="infra-main%2F$(date -u +%Y%m%dT%H%M%SZ)-${{ github.sha }}.tfstate"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            --data-binary @"$state" \
            "https://storage.googleapis.com/upload/storage/v1/b/${STATE_BACKUP_BUCKET}/o?uploadType=media&ifGenerationMatch=0&name=${name}"

  release:
    needs: apply
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/compras/ingest:${{ github.sha }}
      POLICY_TAG_RUT: ${{ needs.apply.outputs.policy_tag_rut }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up tools
        run: scripts/setup.sh
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push the ingest image
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build -f ingest/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Update the ingest jobs
        run: |
          gcloud run jobs update compras-mercadopublico --image="$IMAGE" --region="$GCP_REGION" --project="$GCP_PROJECT_ID"
          gcloud run jobs update compras-indicadores --image="$IMAGE" --region="$GCP_REGION" --project="$GCP_PROJECT_ID"
      # dataform run --schema-suffix=ci --vars=raw_dataset=raw_ci,policy_tag_rut=…, every action with its assertions
      # (no --tags).
      - name: Dataform run in ci (--schema-suffix=ci --vars=raw_dataset=raw_ci,policy_tag_rut=$POLICY_TAG_RUT)
        run: scripts/env.sh scripts/ci/dataform-ci.sh
