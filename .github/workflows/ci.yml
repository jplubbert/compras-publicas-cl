# CI of pull requests to main (REQ-002): local checks, then terraform plan of infra/main authenticated with WIF
# (DEC-004, no service account keys) and its summary as a PR comment. Pull requests from forks skip the plan.
name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up tools
        run: scripts/setup.sh
      - name: Lint
        run: scripts/env.sh npm run lint
      - name: Test
        run: scripts/env.sh npm test
      - name: Check repo
        run: scripts/env.sh npm run check:repo
      - name: Check spec
        run: scripts/env.sh npm run check:spec
      - name: Check descriptions
        run: scripts/env.sh npm run check:descriptions
      # A placeholder shaped like a policy tag: compilation requires it (REQ-014 E5); only the ci run of deploy.yml
      # uses the real name.
      - name: Dataform compile
        run: scripts/env.sh bash -c 'cd dataform && node_modules/.bin/dataform compile --vars=policy_tag_rut=projects/p/locations/us-central1/taxonomies/1/policyTags/2'

  plan:
    needs: checks
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_github_repository: ${{ github.repository }}
      # REQ-014: HCL lists such as ["group:analistas@example.com"]; empty when the variable is not set.
      TF_VAR_pii_readers: ${{ vars.PII_READERS || '[]' }}
      TF_VAR_lector_impersonators: ${{ vars.LECTOR_IMPERSONATORS || '[]' }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up tools
        run: scripts/setup.sh
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}
      - name: Terraform plan
        run: scripts/it/tf-plan.sh main | tee plan.txt
      - name: Comment plan on the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/ci/plan-comment.sh plan.txt > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
