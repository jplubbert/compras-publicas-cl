# Daily pipeline compras-diario (REQ-007, DEC-002): both ingest jobs, then Dataform silver and gold from main.
# Each step waits for the previous one. No try/retry/except: a failed ingest job fails the execution and Dataform
# never runs (E3). The user env vars are set by infra/modules/orchestration.
main:
  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - location: ${sys.get_env("GOOGLE_CLOUD_LOCATION")}
          - repository: ${"projects/" + project + "/locations/" + location + "/repositories/" + sys.get_env("DATAFORM_REPOSITORY")}
          - raw_dataset: ${sys.get_env("RAW_DATASET")}
          - policy_tag_rut: ${sys.get_env("POLICY_TAG_RUT")}
          - dataform_sa: ${sys.get_env("DATAFORM_SERVICE_ACCOUNT")}
    - ingesta_mercadopublico:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + location + "/jobs/" + sys.get_env("JOB_MERCADOPUBLICO")}
          connector_params:
            timeout: 25200
        result: ejecucion_mp
    - ingesta_indicadores:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + location + "/jobs/" + sys.get_env("JOB_INDICADORES")}
          connector_params:
            timeout: 25200
        result: ejecucion_indicadores
    - compilar_dataform:
        call: http.post
        args:
          url: ${"https://dataform.googleapis.com/v1/" + repository + "/compilationResults"}
          auth:
            type: OAuth2
          body:
            gitCommitish: dataform-main
            codeCompilationConfig:
              defaultDatabase: ${project}
              defaultLocation: ${location}
              vars:
                raw_dataset: ${raw_dataset}
                policy_tag_rut: ${policy_tag_rut}
        result: compilacion
    - revisar_compilacion:
        switch:
          - condition: ${"compilationErrors" in compilacion.body}
            raise: ${compilacion.body.compilationErrors}
    - invocar_dataform:
        call: http.post
        args:
          url: ${"https://dataform.googleapis.com/v1/" + repository + "/workflowInvocations"}
          auth:
            type: OAuth2
          body:
            compilationResult: ${compilacion.body.name}
            invocationConfig:
              includedTags: ["silver", "gold"]
              transitiveDependenciesIncluded: true
              serviceAccount: ${dataform_sa}
        result: invocacion
    - esperar_dataform:
        call: sys.sleep
        args:
          seconds: 60
    - consultar_dataform:
        call: http.get
        args:
          url: ${"https://dataform.googleapis.com/v1/" + invocacion.body.name}
          auth:
            type: OAuth2
        result: estado
    - evaluar_dataform:
        switch:
          - condition: ${estado.body.state == "SUCCEEDED"}
            next: fin
          - condition: ${estado.body.state == "FAILED" or estado.body.state == "CANCELLED"}
            raise:
              invocation: ${invocacion.body.name}
              state: ${estado.body.state}
        next: esperar_dataform
    - fin:
        return:
          ejecucion_mercadopublico: ${ejecucion_mp.name}
          ejecucion_indicadores: ${ejecucion_indicadores.name}
          invocacion_dataform: ${invocacion.body.name}
